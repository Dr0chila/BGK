# ЭТАП 1 — до выпуска сертификата (только HTTP), чтобы certbot подтвердил домен.
# Домен bgk-obuch.duckdns.org (DuckDNS → IP сервера).
# На сервере стоит ISPmanager: он управляет /etc/nginx/vhosts/ и перезаписывает их.
# Наш конфиг кладём в sites-enabled — nginx его подключает, панель туда не лезет.
# Домен bgk-obuch в ISPmanager НЕ добавлять — будет конфликт server_name.
#
#   mkdir -p /var/www/letsencrypt
#   cp deploy/nginx-bgk.conf /etc/nginx/sites-enabled/bgk.conf
#   nginx -t && systemctl reload nginx
#   certbot certonly --webroot -w /var/www/letsencrypt -d bgk-obuch.duckdns.org --deploy-hook "systemctl reload nginx"
#
# Затем — deploy/nginx-bgk-ssl.conf.

server {
    listen 80;
    listen [::]:80;
    server_name bgk-obuch.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}
