# ЭТАП 1 — до выпуска сертификата (только HTTP), чтобы certbot подтвердил домен.
# Заменить bgk.example.ru на свой домен (во всех трёх файлах deploy/ и в .env).
#
#   sudo cp deploy/nginx-bgk.conf /etc/nginx/sites-available/bgk
#   sudo ln -sf /etc/nginx/sites-available/bgk /etc/nginx/sites-enabled/bgk
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html -d bgk.example.ru
#
# Затем — deploy/nginx-bgk-ssl.conf.

server {
    listen 80;
    listen [::]:80;
    server_name bgk.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
