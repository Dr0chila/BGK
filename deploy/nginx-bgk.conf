# ЭТАП 1 — до выпуска сертификата (только HTTP), чтобы certbot подтвердил домен.
# Домен bgk-obuch.duckdns.org (DuckDNS → IP сервера).
#
#   sudo cp deploy/nginx-bgk.conf /etc/nginx/sites-available/bgk
#   sudo ln -sf /etc/nginx/sites-available/bgk /etc/nginx/sites-enabled/bgk
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html -d bgk-obuch.duckdns.org
#
# Затем — deploy/nginx-bgk-ssl.conf.

server {
    listen 80;
    listen [::]:80;
    server_name bgk-obuch.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
