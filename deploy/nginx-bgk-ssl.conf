# ЭТАП 2 — рабочий конфиг, после выпуска сертификата.
#   sudo cp deploy/nginx-bgk-ssl.conf /etc/nginx/sites-available/bgk
#   sudo nginx -t && sudo systemctl reload nginx
# Продление certbot делает сам (systemd-таймер certbot.timer); проверка: sudo certbot renew --dry-run

server {
    listen 80;
    listen [::]:80;
    server_name bgk.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bgk.example.ru;

    ssl_certificate     /etc/letsencrypt/live/bgk.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bgk.example.ru/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
