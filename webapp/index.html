<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>БГК — обучалка официанта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pom:#C8102E; --pom-soft:#FBE3E7; --teal:#135E66; --teal-soft:#DCEDEE;
  --ink:#231C1C; --muted:#6B5F5F; --paper:#FFFFFF; --line:#EADCDC; --ok:#1E7B46; --ok-soft:#E1F3E8; --bad-soft:#FDE6E6;
  --table:#FFFFFF; --wall:#231C1C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pom:#FF5A73; --pom-soft:#3A1A20; --teal:#5BC3CC; --teal-soft:#132E31;
    --ink:#F3ECEC; --muted:#B5A8A8; --paper:#171313; --line:#3A3030; --ok:#5BD48D; --ok-soft:#14301F; --bad-soft:#3A1717;
    --table:#241D1D; --wall:#F3ECEC;
  }
}
:root[data-theme="dark"]{
  --pom:#FF5A73; --pom-soft:#3A1A20; --teal:#5BC3CC; --teal-soft:#132E31;
  --ink:#F3ECEC; --muted:#B5A8A8; --paper:#171313; --line:#3A3030; --ok:#5BD48D; --ok-soft:#14301F; --bad-soft:#3A1717;
  --table:#241D1D; --wall:#F3ECEC;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:17px/1.5 "PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.tab,.chip,.big{font-family:Oswald,"Arial Narrow",Impact,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}
header.top{padding:22px 0 6px;border-bottom:3px solid var(--pom)}
header.top h1{margin:0;font-size:34px;line-height:1.05;color:var(--pom);letter-spacing:.5px}
header.top p{margin:6px 0 10px;color:var(--muted);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chip{flex:0 0 auto;border:2px solid var(--pom);background:transparent;color:var(--pom);padding:6px 14px;border-radius:999px;font-size:17px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pom);color:#fff}
h2{font-size:26px;margin:18px 0 6px;color:var(--ink)}
h3{font-size:20px;margin:18px 0 4px;color:var(--teal)}
.lead{color:var(--muted);margin:0 0 12px}
.lunch{border-left:6px solid var(--pom);padding:4px 0 4px 14px;margin:22px 0}
.lunch h3{margin-top:0;color:var(--pom);font-size:24px}
.dish{margin:10px 0}
.dish b{display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:13px;padding:1px 8px;border-radius:6px;background:var(--teal-soft);color:var(--teal)}
.tag.w{background:var(--pom-soft);color:var(--pom)}
.note{background:var(--teal-soft);padding:12px 14px;border-radius:10px;margin:14px 0}
.warn{background:var(--pom-soft);padding:12px 14px;border-radius:10px;margin:14px 0}
table.grid{width:100%;border-collapse:collapse;margin:8px 0}
table.grid td,table.grid th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;font-size:16px}
table.grid th{font-family:Oswald,sans-serif;font-weight:500;color:var(--muted)}
.scroll{overflow-x:auto}
.step{display:grid;grid-template-columns:42px 1fr;gap:10px;margin:16px 0}
.step .n{font-family:Oswald,sans-serif;font-size:30px;line-height:1;color:var(--pom);text-align:center}
.step p{margin:2px 0}
.wine{padding:12px 0;border-bottom:1px solid var(--line)}
.wine .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.wine .price{font-family:Oswald,sans-serif;color:var(--teal);white-space:nowrap}
.wine .meta{color:var(--muted);font-size:15px}
.wine .pitch{font-style:italic;margin-top:4px}
.dict{padding:10px 0;border-bottom:1px solid var(--line)}
.dict b{color:var(--pom)}
/* map */
.mapbox{margin:10px 0 4px}
.floorsel{display:flex;gap:8px;margin:8px 0}
svg.map{width:100%;height:auto;display:block;touch-action:manipulation}
svg.map .wall{fill:none;stroke:var(--wall);stroke-width:3}
svg.map .fix{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2}
svg.map .fixt{fill:var(--teal);font:600 18px Oswald,sans-serif}
svg.map .t{cursor:pointer}
svg.map .t .s{fill:var(--table);stroke:var(--wall);stroke-width:2.5}
svg.map .t text{fill:var(--ink);font:700 22px Oswald,sans-serif;pointer-events:none}
svg.map .t.hl .s{fill:var(--pom);stroke:var(--pom)}
svg.map .t.hl text{fill:#fff}
svg.map .t.ok .s{fill:var(--ok);stroke:var(--ok)}
svg.map .t.ok text{fill:#fff}
svg.map .t.no .s{fill:var(--pom-soft);stroke:var(--pom);stroke-dasharray:6 4}
svg.map.quiz .t text{opacity:0}
svg.map.quiz .t.ok text,svg.map.quiz .t.no text,svg.map.quiz.reveal .t text{opacity:1}
svg.map .t:focus-visible .s{stroke:var(--teal);stroke-width:5}
.mapinfo{min-height:52px;padding:10px 12px;border-radius:10px;background:var(--teal-soft);margin-top:8px}
/* quiz */
.qcard{margin-top:16px}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--pom);transition:width .3s}
.q{font-size:21px;line-height:1.35;margin:4px 0 14px;font-weight:700}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--teal)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--pom);background:var(--bad-soft)}
.opt.pick{border-color:var(--teal);background:var(--teal-soft)}
.opt:disabled{cursor:default}
.ex{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--teal-soft)}
.btn{font-family:Oswald,sans-serif;font-size:19px;border:0;border-radius:12px;padding:12px 20px;background:var(--pom);color:#fff;cursor:pointer;margin-top:14px}
.btn.ghost{background:transparent;color:var(--pom);border:2px solid var(--pom)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.big{font-size:64px;line-height:1;color:var(--pom);margin:20px 0 4px}
.mist{border-top:1px solid var(--line);padding:10px 0}
.mist .yours{color:var(--pom)}
.mist .right{color:var(--ok)}
/* ---------- нижняя панель (плавающая, как в Magic Farm) ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 12px;z-index:5;pointer-events:none}
nav.tabs .in{--n:3;--i:0;position:relative;display:flex;width:100%;max-width:520px;padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:0 10px 30px rgba(35,28,28,.18),0 2px 6px rgba(35,28,28,.08);pointer-events:auto;
  animation:dockIn .5s cubic-bezier(.2,.9,.3,1.2) both}
nav.tabs .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/var(--n));border-radius:18px;background:var(--pom-soft);
  transform:translateX(calc(var(--i)*100%));transition:transform .38s cubic-bezier(.3,1.3,.5,1)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:6px 2px 5px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .25s}
.tab .ico{font-size:22px;line-height:1.1;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tab .lbl{font-size:13px;letter-spacing:.3px}
.tab[aria-current="page"]{color:var(--pom)}
.tab[aria-current="page"] .ico{transform:translateY(-2px) scale(1.18)}
.tab:active .ico{transform:scale(.88)}
.tab[hidden]{display:none}
@keyframes dockIn{from{opacity:0;transform:translateY(30px) scale(.96)}}

/* ---------- полный экран Telegram: отступ под часы/вырез ---------- */
header.top{padding-top:calc(22px + var(--tg-safe-top,0px))}

/* ---------- анимации: всё, что вставляется заново, плавно выезжает ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes grow{from{transform:scaleX(0)}}
#app>*,#lt>*,.qcard>*,#fb>*,#ad>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#lt>*:nth-child(2),.qcard>*:nth-child(2),#ad>*:nth-child(2){animation-delay:.04s}
#lt>*:nth-child(3),.qcard>*:nth-child(3),#ad>*:nth-child(3){animation-delay:.08s}
#lt>*:nth-child(4),.qcard>*:nth-child(4),#ad>*:nth-child(4){animation-delay:.12s}
#lt>*:nth-child(5),.qcard>*:nth-child(5),#ad>*:nth-child(5){animation-delay:.16s}
#lt>*:nth-child(6),.qcard>*:nth-child(6),#ad>*:nth-child(6){animation-delay:.2s}
#lt>*:nth-child(n+7),.qcard>*:nth-child(n+7),#ad>*:nth-child(n+7){animation-delay:.24s}
.opt,.btn,.chip,.card{transition:transform .18s ease,background-color .25s,border-color .25s,box-shadow .25s}
.opt:active,.btn:active,.chip:active,.card:active{transform:scale(.97)}
.opt.ok{animation:pop .45s ease}
.opt.no{animation:shake .45s ease}
.big{display:inline-block;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}

/* ---------- админка ---------- */
.card{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;cursor:pointer;box-shadow:0 2px 8px rgba(35,28,28,.05)}
.card:hover{border-color:var(--teal)}
.card .who{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .who b{font-size:18px}
.meta{color:var(--muted);font-size:14px}
.prog{display:grid;grid-template-columns:62px 1fr 42px;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.prog .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .tr i{display:block;height:100%;border-radius:4px;background:var(--teal);transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.prog .tr i.pass{background:var(--ok)}
.prog .v{text-align:right;color:var(--muted)}
.badge{display:inline-block;font-size:13px;padding:2px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--pom-soft);color:var(--pom)}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.skel{height:84px;border-radius:16px;margin:10px 0;background:linear-gradient(90deg,var(--line) 0%,var(--paper) 50%,var(--line) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite;opacity:.6}
@keyframes shim{to{background-position:-200% 0}}
.back{background:none;border:0;color:var(--teal);font:inherit;cursor:pointer;padding:8px 0}
.att{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

const TG=window.Telegram?.WebApp?.initData ? window.Telegram.WebApp : null;
if(TG){
  try{
    TG.ready();
    if(TG.colorScheme) document.documentElement.dataset.theme=TG.colorScheme;
    const mobile=!["tdesktop","macos","weba","webk","web","unknown"].includes((TG.platform||"unknown").toLowerCase());
    if(mobile){
      TG.expand();
      if(typeof TG.requestFullscreen==="function") TG.requestFullscreen();
      // свайп вниз внутри обучалки — это прокрутка, а не закрытие
      if(typeof TG.disableVerticalSwipes==="function") TG.disableVerticalSwipes();
    } else if(TG.isFullscreen && typeof TG.exitFullscreen==="function") TG.exitFullscreen();
    const setInset=()=>{
      const top=(TG.isFullscreen&&TG.safeAreaInset?.top)||0, cont=TG.contentSafeAreaInset?.top||0;
      document.documentElement.style.setProperty("--tg-safe-top",(top+cont)+"px");
    };
    setInset();
    ["fullscreenChanged","safeAreaChanged","contentSafeAreaChanged"].forEach(e=>TG.onEvent?.(e,setInset));
  }catch(e){}
}

  return r.json();
}

const $=s=>document.querySelector(s);
const app=$("#app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function mapSVG(f,{quiz=false,hl=null}={}){
  const F=FLOORS[f];
  const tables=F.t.map(t=>{
    let shape,tx,ty;
    if(t.c){const[x,y,r]=t.c;shape=`<circle class="s" cx="${x}" cy="${y}" r="${r}"/>`;tx=x;ty=y}
    else{const[x,y,w,h]=t.r;shape=`<rect class="s" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;tx=x+w/2;ty=y+h/2}
    const rot=t.rot?` transform="rotate(${t.rot} ${tx} ${ty})"`:"";
    return `<g class="t${hl===t.n?" hl":""}" data-n="${t.n}" tabindex="0" role="button" aria-label="${quiz?"стол":"стол "+t.n}"${rot}>${shape}<text x="${tx}" y="${ty+8}" text-anchor="middle">${t.n}</text></g>`;
  }).join("");
  return `<svg class="map${quiz?" quiz":""}" viewBox="${F.vb}" xmlns="http://www.w3.org/2000/svg">${F.walls}${F.fix}${tables}</svg>`;
}

  <div class="floorsel"><button class="chip" aria-pressed="${floor===1}" data-f="1">1 этаж</button><button class="chip" aria-pressed="${floor===2}" data-f="2">2 этаж</button></div>
  <div class="mapbox" id="mb">${mapSVG(floor)}</div><div class="mapinfo" id="mi">${floor===1?"Вход справа внизу. Касса и бар — сверху.":"Маршрут: 40→42 вверх по левой стене, 43–44 по верху, 45–46 у кончика овала, 47→51 по низу справа налево."}</div>
  <div class="note">${floor===1?"<b>1 этаж:</b> у входа 10, по правой стене вверх 11, 14, 12 (13 нет). Центр — круглые 15–18. У кассы 19. Нижний ряд: лестница → 20, 21, 22 → гардероб. Дальний зал 31–37: сверху круглые 31, 32, 33 (справа налево), слева 34 и туалет (WC), снизу 35, 36, 37.":"<b>2 этаж:</b> номера идут подряд по кругу против часовой стрелки от левого нижнего угла (40, у лестницы) до 51. 48 — маленький, у овала, над 49."}</div>`;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{floor=+b.dataset.f;learnMap(el)});
  const pick=n=>{el.querySelectorAll(".t").forEach(g=>g.classList.toggle("hl",+g.dataset.n===n));$("#mi").innerHTML=`<b>Стол ${n}.</b> ${TABLE_NOTES[n]||""}`};
  el.querySelectorAll(".t").forEach(g=>{g.onclick=()=>pick(+g.dataset.n);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(+g.dataset.n)}}});
}
function learnWine(el){
  const cats=["Белое","Красное","Розовое","Игристое"];
  el.innerHTML=`<h2>Вина</h2><p class="lead">Цены — за бокал 125 мл. Для каждого вина главное: цвет, сладость, страна и фраза для гостя.</p>
  <div class="note"><b>Основы.</b> Белое: сок сразу отделяют от кожицы — светлое, свежее, к рыбе и салатам. Красное: бродит с кожицей — цвет и танины (терпкость), к мясу и грилю. Розовое: красный виноград, кожица всего несколько часов — лёгкое, ягодное, универсальное. Игристое: вторичное брожение даёт пузырьки — аперитив.<br><br><b>Сладость:</b> сухое → полусухое → полусладкое → сладкое. Фруктовый аромат ≠ сладость.<br><b>Игристые:</b> Brut Nature → Extra Brut → Brut → Extra Dry → Sec → Demi-Sec → Doux. Extra Dry слаще, чем Brut.</div>
  <div class="note"><b>Грузинская пятёрка:</b> Цинандали (белое сухое), Алазанская долина (белое и красное, полусладкие), Саперави (красное сухое), Киндзмараули (красное полусладкое), Асканели (игристое брют).</div>`+
  cats.map(c=>`<h3>${c}</h3>`+WINES.filter(w=>w.cat===c).map(w=>`<div class="wine"><div class="head"><b>${w.name}</b><span class="price">${w.price} ₽</span></div><div class="meta">${w.style}, ${w.country}</div><div>${w.taste}</div><div class="pitch">«Если хочется: ${w.pitch.charAt(0).toLowerCase()+w.pitch.slice(1)}»</div><div class="meta">К чему: ${w.pair}</div></div>`).join("")).join("")+
  `<div class="warn">Помни: к рыбе и салатам — белое, к мясу — красное. Вино предлагаешь при основном заказе, бутылку — исходя из горячего.</div>`;
}

/* ===================== QUIZ ENGINE ===================== */
let run=null;
function prep(q){
  if(q.t==="mc"){const opts=shuffle([q.right,...q.wrongs.slice(0,3)]);return {...q,opts,ans:opts.indexOf(q.right)}}
  return {...q};
}
function startRun(mode,cat){
  let pool;
  if(mode==="test"){
    pool = cat==="Столы" ? shuffle(MAPQ).slice(0,15) : shuffle(QB.filter(q=>q.cat===cat)).slice(0,15);
  } else {
    const take=(c,n)=>shuffle(QB.filter(q=>q.cat===c)).slice(0,n);
    pool=shuffle([...take("Обеды",10),...take("Сервис",7),...take("Вина",8),...take("Меню",5),...shuffle(MAPQ).slice(0,8)]);
  }
  run={mode,cat,qs:pool.map(prep),i:0,answers:[],locked:false};
  renderQ();
}
function renderQ(){
  const r=run, q=r.qs[r.i], total=r.qs.length;
  const head=`<div class="qcard"><div class="qmeta"><span>${r.mode==="exam"?"Экзамен":"Тест: "+r.cat}</span><span>${r.i+1} / ${total}</span></div><div class="bar"><i style="width:${(r.i/total)*100}%"></i></div>`;
  if(q.t==="mc"){
    app.innerHTML=head+`<div class="q">${esc(q.q)}</div>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}<div id="fb"></div></div>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerMC(+b.dataset.k));
  } else {
    app.innerHTML=head+`<div class="q">${esc(q.q)}</div><div class="mapbox">${mapSVG(q.floor,{quiz:true})}</div><div id="fb"></div></div>`;
    app.querySelectorAll(".t").forEach(g=>{g.onclick=()=>answerMap(+g.dataset.n);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();answerMap(+g.dataset.n)}}});
  }
}
function nextBtn(){
  const last=run.i===run.qs.length-1;
  return `<button class="btn" id="nx">${last?"Показать результат":"Дальше"}</button>`;
}
function bindNext(){ $("#nx").onclick=()=>{ if(run.i<run.qs.length-1){run.i++;run.locked=false;renderQ();window.scrollTo(0,0)} else finish() }; $("#nx").focus(); }
function answerMC(k){
  if(run.locked) return; run.locked=true;
  const q=run.qs[run.i], ok=k===q.ans;
  run.answers.push({q,ok,given:q.opts[k]}); haptic(run.mode==="test"?(ok?"ok":"no"):"tap");
  const btns=app.querySelectorAll(".opt"); btns.forEach(b=>b.disabled=true);
  if(run.mode==="test"){
    btns[q.ans].classList.add("ok"); if(!ok) btns[k].classList.add("no");
    $("#fb").innerHTML=`<div class="ex"><b>${ok?"Верно.":"Неверно."}</b> ${esc(q.ex||"")}</div>`+nextBtn();
  } else { btns[k].classList.add("pick"); $("#fb").innerHTML=nextBtn(); }
  bindNext();
}
function answerMap(n){
  if(run.locked) return; run.locked=true;
  const q=run.qs[run.i], ok=n===q.target;
  run.answers.push({q,ok,given:"стол "+n}); haptic(run.mode==="test"?(ok?"ok":"no"):"tap");
  const svg=app.querySelector("svg.map");
  const g=svg.querySelector(`.t[data-n="${n}"]`), gt=svg.querySelector(`.t[data-n="${q.target}"]`);
  if(run.mode==="test"){
    gt.classList.add("ok"); if(!ok) g.classList.add("no");
    $("#fb").innerHTML=`<div class="ex"><b>${ok?"Верно.":"Неверно, ты нажал "+n+"."}</b> Стол ${q.target}: ${TABLE_NOTES[q.target]||""}</div>`+nextBtn();
  } else { g.classList.add("hl"); $("#fb").innerHTML=nextBtn(); }
  bindNext();
}
function finish(){
  const r=run, right=r.answers.filter(a=>a.ok).length, total=r.answers.length, pct=Math.round(right/total*100);
  const wrong=r.answers.filter(a=>!a.ok);
  let verdict="";
  if(r.mode==="exam"){
    const passed=pct>=85;
    const best=store.get("bgk_best",0); if(pct>best) store.set("bgk_best",pct);
    verdict=passed?"Экзамен сдан. Ты готов к проверке.":"Пока не сдан: нужно 85% и выше. Повтори темы с ошибками в тестах и пересдай.";
  } else verdict=pct>=85?"Тема закрыта. Переходи к следующей.":"Повтори тему в разделе «Учить» и пройди тест ещё раз.";
  if(TG?.initData) fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':TG.initData},
    body:JSON.stringify({mode:r.mode,topic:r.mode==='test'?r.cat:null,score:right,total,pct,
      mistakes:wrong.map(a=>({cat:a.q.cat,q:a.q.q,given:a.given,right:a.q.t==='mc'?a.q.right:'стол '+a.q.target}))})}).catch(()=>{});
  const weak={}; wrong.forEach(a=>weak[a.q.cat]=(weak[a.q.cat]||0)+1);
  app.innerHTML=`<div class="big">${pct}%</div><p><b>${right} из ${total}.</b> ${verdict}</p>`+
   (Object.keys(weak).length?`<div class="warn">Ошибки по темам: ${Object.entries(weak).map(([c,n])=>`${c} — ${n}`).join(", ")}</div>`:"")+
   `<div class="row"><button class="btn" id="again">${r.mode==="exam"?"Пересдать":"Ещё раз"}</button><button class="btn ghost" id="back">${r.mode==="exam"?"К экзамену":"К темам"}</button></div>`+
   (wrong.length?`<h3>Разбор ошибок</h3>`+wrong.map(a=>{
     const corr=a.q.t==="mc"?a.q.right:`стол ${a.q.target} — ${TABLE_NOTES[a.q.target]||""}`;
     return `<div class="mist"><b>${esc(a.q.q)}</b><br><span class="yours">Твой ответ: ${esc(a.given)}</span><br><span class="right">Правильно: ${esc(corr)}</span>${a.q.ex?`<br><span class="meta">${esc(a.q.ex)}</span>`:""}</div>`}).join(""):"");
  countUp(app.querySelector(".big"),pct);
  $("#again").onclick=()=>startRun(r.mode,r.cat);
  $("#back").onclick=()=>{run=null;go(r.mode)};
  window.scrollTo(0,0);
}
function renderTestMenu(){
  const res=store.get("bgk_tests",{});
  app.innerHTML=`<h2>Тест по темам</h2><p class="lead">15 вопросов, сразу видишь правильный ответ и объяснение. Тема считается закрытой от 85%.</p>`+
   TOPICS.map(t=>`<button class="opt" data-t="${t}"><b>${t}</b>${res[t]!=null?` <span class="meta">— последний результат ${res[t]}%</span>`:""}</button>`).join("");
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>startRun("test",b.dataset.t));
}
function renderExamMenu(){
  const best=store.get("bgk_best",null);
  app.innerHTML=`<h2>Экзамен</h2><p class="lead">38 вопросов вперемешку: обеды, сервис, вина, меню и столы на карте. Ответы не показываются до конца — как на настоящей проверке. Сдан от 85%.</p>`+
   (best!=null?`<p>Лучший результат: <b>${best}%</b></p>`:"")+`<button class="btn" id="go">Начать экзамен</button>`;
  $("#go").onclick=()=>startRun("exam");
}
// remember test scores
const _finish=finish;
finish=function(){ if(run&&run.mode==="test"){const r=run,res=store.get("bgk_tests",{});res[r.cat]=Math.round(r.answers.filter(a=>a.ok).length/r.answers.length*100);store.set("bgk_tests",res)} _finish(); };

/* ===================== NAV ===================== */
function countUp(el,to){
  if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0=performance.now(),d=700;
  const f=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+"%";if(k<1)requestAnimationFrame(f)};
  requestAnimationFrame(f);
}
// Подсветка-«пилюля» под активной вкладкой ездит по --i, ширина делится на --n видимых вкладок
function placePill(v){
  const tabs=[...document.querySelectorAll(".tab")].filter(t=>!t.hidden);
  tabs.forEach(t=>t.dataset.v===v?t.setAttribute("aria-current","page"):t.removeAttribute("aria-current"));
  const dock=document.querySelector("nav.tabs .in");
  dock.style.setProperty("--n",tabs.length);
  dock.style.setProperty("--i",Math.max(0,tabs.findIndex(t=>t.dataset.v===v)));
}
function go(v){
  placePill(v);
  run=null;
  if(v==="learn") renderLearn(); if(v==="test") renderTestMenu(); if(v==="exam") renderExamMenu(); if(v==="admin") renderAdmin();
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{haptic("tap");go(t.dataset.v)});
go("learn");

/* ===================== ADMIN ===================== */
// Вкладка видна только админам: роль берём с сервера по подписанному initData.
// Сервер всё равно проверяет роль на каждом /api/admin/* — скрытая кнопка не защита, а удобство.
if(TG) api("/api/me").then(me=>{
  if(me.registered&&me.status==="active"&&(me.role==="admin"||me.role==="owner")){
    document.querySelector('.tab[data-v="admin"]').hidden=false;
    placePill(document.querySelector('.tab[aria-current="page"]')?.dataset.v||"learn");
  }
}).catch(()=>{});

let adminTab="trainees";
const fmtDate=iso=>iso?new Date(iso).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const pctBadge=(v,pass)=>v==null?`<span class="badge">—</span>`:`<span class="badge ${v>=pass?"ok":""}">${v}%</span>`;
const progRow=(name,v,pass)=>`<div class="prog"><span>${esc(name)}</span><span class="tr"><i class="${v>=pass?"pass":""}" style="width:${v||0}%"></i></span><span class="v">${v==null?"—":v+"%"}</span></div>`;
const skel=n=>Array.from({length:n},()=>`<div class="skel"></div>`).join("");
const empty=t=>`<div class="empty">${t}</div>`;

function renderAdmin(){
  app.innerHTML=`<div class="chips" role="tablist">
    <button class="chip" aria-pressed="${adminTab==="trainees"}" data-at="trainees">Стажёры</button>
    <button class="chip" aria-pressed="${adminTab==="pending"}" data-at="pending">Заявки</button></div><section id="ad"></section>`;
  app.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{haptic("tap");adminTab=b.dataset.at;renderAdmin()});
  adminTab==="trainees"?adminTrainees():adminPending();
}
async function adminTrainees(){
  const el=$("#ad"); el.innerHTML=skel(3);
  try{
    const d=await api("/api/admin/trainees");
    if(!d.items.length){el.innerHTML=empty("Активных стажёров пока нет");return}
    el.innerHTML=`<p class="lead">Всего: ${d.items.length}. Нажми на стажёра — попытки и частые ошибки.</p>`+d.items.map(u=>`
      <button class="card" data-id="${u.id}">
        <div class="who"><b>${esc(u.name)}</b>${pctBadge(u.exam,d.pass)}</div>
        <div class="meta">${u.username?"@"+esc(u.username)+" · ":""}был(а): ${fmtDate(u.last)}</div>
        ${d.topics.map(t=>progRow(t,u.topics[t],d.pass)).join("")}
      </button>`).join("");
    el.querySelectorAll(".card").forEach(c=>c.onclick=()=>{haptic("tap");adminTrainee(+c.dataset.id,d)});
  }catch(e){el.innerHTML=`<div class="warn">Не удалось загрузить. Проверь интернет и открой обучалку заново.</div>`}
}
async function adminTrainee(id,list){
  const el=$("#ad"); el.innerHTML=skel(2); window.scrollTo({top:0,behavior:"smooth"});
  try{
    const u=await api("/api/admin/trainees/"+id);
    el.innerHTML=`<button class="back" id="bk">← Все стажёры</button>
      <h2>${esc(u.name)}</h2><div class="meta">${u.username?"@"+esc(u.username)+" · ":""}был(а): ${fmtDate(u.last)}</div>
      <div class="note">${list.topics.map(t=>progRow(t,u.topics[t],list.pass)).join("")}${progRow("Экзамен",u.exam,list.pass)}${u.exams?`<div class="meta">Попыток экзамена: ${u.exams}</div>`:""}</div>
      <h3>Последние попытки</h3>${u.attempts.length?u.attempts.map(a=>`<div class="att"><span>${a.mode==="exam"?"🎓 Экзамен":esc(a.topic)} · ${a.score}/${a.total}</span><span>${pctBadge(a.pct,list.pass)} <span class="meta">${fmtDate(a.at)}</span></span></div>`).join(""):empty("Попыток нет")}
      <h3>Частые ошибки</h3>${u.mistakes.length?u.mistakes.map(m=>`<div class="att"><span>${esc(m.q)}</span><span class="badge no">${m.n}×</span></div>`).join(""):empty("Ошибок нет")}`;
    $("#bk").onclick=()=>{haptic("tap");adminTrainees()};
  }catch(e){el.innerHTML=`<div class="warn">Не удалось загрузить стажёра.</div>`}
}
async function adminPending(){
  const el=$("#ad"); el.innerHTML=skel(2);
  const none=()=>empty("Новых заявок нет 🎉");
  try{
    const d=await api("/api/admin/pending");
    if(!d.items.length){el.innerHTML=none();return}
    el.innerHTML=d.items.map(u=>`<div class="card" data-id="${u.id}" style="cursor:default">
      <div class="who"><b>${esc(u.name)}</b><span class="meta">${fmtDate(u.at)}</span></div>
      <div class="meta">${u.username?"@"+esc(u.username):"без username"}</div>
      <div class="row"><button class="btn" data-ok="1">Принять</button><button class="btn ghost" data-ok="0">Отклонить</button></div></div>`).join("");
    el.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{
      const card=b.closest(".card"), ok=b.dataset.ok==="1";
      card.querySelectorAll("button").forEach(x=>x.disabled=true);
      // 409 — заявку уже разобрал другой админ: карточку всё равно убираем
      try{await api("/api/admin/pending/"+card.dataset.id,{method:"POST",body:JSON.stringify({approve:ok})});haptic("ok")}
      catch(e){if(e.message!=="409"){haptic("no");card.querySelectorAll("button").forEach(x=>x.disabled=false);return}}
      card.style.transition="opacity .3s,transform .3s"; card.style.opacity="0"; card.style.transform=`translateX(${ok?40:-40}px)`;
      setTimeout(()=>{card.remove();if(!el.querySelector(".card"))el.innerHTML=none()},300);
    });
  }catch(e){el.innerHTML=`<div class="warn">Не удалось загрузить заявки.</div>`}
}
</script>
